name: Storybook Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --registry=https://registry.npmjs.org

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build Storybook
        run: npm run build-storybook
        env:
          STORYBOOK_BASE_PATH: /shopify-app-kit/

      - name: Verify Storybook output
        run: |
          test -f packages/shopify-app-kit/storybook-static/index.html
          test -f packages/shopify-app-kit/storybook-static/products/index.html
          test -f packages/shopify-app-kit/storybook-static/products/assets/besttrack.png

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: packages/shopify-app-kit/storybook-static

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployed Products page
        run: curl --fail --retry 5 --retry-delay 5 --retry-connrefused -I "${{ steps.deployment.outputs.page_url }}products/"
