name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci --registry=https://registry.npmjs.org
      - run: npm run lint
      - name: Run tests
        run: |
          set +e
          npm run test:ci > test-output.txt 2>&1
          status=$?
          cat test-output.txt
          if [ "$status" -ne 0 ]; then
            node -e 'const fs=require("node:fs");const output=fs.readFileSync("test-output.txt","utf8").trim().split("\n").slice(-80).join("\n");const escaped=output.replaceAll("%","%25").replaceAll("\r","%0D").replaceAll("\n","%0A");console.log(`::error title=Vitest failed::${escaped}`);'
            exit "$status"
          fi
      - run: npm run typecheck
      - run: npm run build
      - run: npm run build-storybook
      - run: npm --prefix packages/shopify-app-kit run verify:package
      - run: npx playwright install --with-deps chromium
      - run: npm --prefix packages/shopify-app-kit run test:e2e
      - name: Publish package with release channel
        run: |
          version=$(node -p "require('./package.json').version")
          tag=latest
          case "$version" in
            *-*) tag=next ;;
          esac
          npm publish --access public --tag "$tag" --provenance
        working-directory: packages/shopify-app-kit
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
